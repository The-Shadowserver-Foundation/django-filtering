name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Backend (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.1"]
        # Only run combinations that Django officially supports:
        #   Django 5.2 -> Python 3.10-3.14
        #   Django 6.1 -> Python 3.12-3.14
        #   Django 7.0 -> Python ...
        # exclude:  # example ...
        #   - django-version: "7.0"
        #     python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tests]" "django==${{ matrix.django-version }}.*"

      - name: Show versions
        run: python -c "import sys, django; print(f'Python {sys.version.split()[0]} / Django {django.get_version()}')"

      - name: Run pytest
        run: pytest
